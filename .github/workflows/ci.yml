name: CI

on:
  push:
    branches: [main, poro-old-mvp]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build kparser2.sln -c Release
      - name: Test
        run: dotnet test kparser2.sln -c Release --no-build --filter "Category!=Integration"
